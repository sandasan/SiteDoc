<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SiteDoc</title>
<link rel="stylesheet" href="styles.css">
<body class="popup">
  <main>
    <header class="popup-brand">
      <span class="mark" aria-hidden="true">S</span>
      <div><b>SiteDoc</b><small>Сохранение документации офлайн</small></div>
    </header>

    <label for="collection">Библиотека для сохранения</label>
    <div class="library-picker">
      <select id="collection"></select>
      <button id="showCreateLibrary" class="new-library-toggle" type="button" title="Создать библиотеку">＋</button>
    </div>
    <form id="createLibraryForm" class="create-library" hidden>
      <label class="visually-hidden" for="libraryName">Название библиотеки</label>
      <input id="libraryName" type="text" maxlength="80" placeholder="Название новой библиотеки" autocomplete="off" required>
      <button class="primary" type="submit">Создать</button>
      <button id="cancelCreateLibrary" type="button" aria-label="Отменить создание">×</button>
    </form>

    <div class="popup-actions">
      <button id="save" class="primary action-card">
        <span class="action-icon" aria-hidden="true">＋</span>
        <span><b>Сохранить эту страницу</b><small>Добавить или обновить открытую страницу</small></span>
      </button>
      <button id="findSection" class="secondary action-card">
        <span class="action-icon" aria-hidden="true">☷</span>
        <span><b>Найти страницы раздела</b><small>Соседние страницы из меню документации</small></span>
      </button>
    </div>

    <section id="sectionPreview" class="section-preview" hidden aria-label="Найденные страницы">
      <div class="preview-heading">
        <div><b>Страницы раздела</b><small id="sectionContext">Проверьте состав перед добавлением</small></div>
        <span id="resultCount" class="count-badge"></span>
      </div>
      <label class="select-all"><input id="selectAll" type="checkbox" checked><span>Выбрать все</span><small id="selectedCount"></small></label>
      <div id="sectionLinks"></div>
      <button id="addSelected" class="primary add-selected" hidden>Добавить выбранные страницы</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <footer class="popup-footer"><a href="library.html" target="_blank">Открыть библиотеку <span aria-hidden="true">↗</span></a></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
